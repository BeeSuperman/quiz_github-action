# =====================================================
# 生產環境設定（EC2 部署使用）
# 啟動方式：環境變數 SPRING_PROFILES_ACTIVE=prod
# 密碼從環境變數讀取，不寫在程式碼裡
# =====================================================

# EC2 上的 MySQL 連線（容器內部互通用 localhost）
spring.datasource.url=jdbc:mysql://localhost:3306/quiz_1141121?serverTimezone=GMT%2B8&useSSL=false&rewriteBatchedStatements=true
spring.datasource.username=root
# ${DB_PASSWORD}：從系統環境變數 DB_PASSWORD 讀取，不寫死密碼
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 生產環境不印 SQL（效能考量、避免洩漏資料庫結構）
spring.jpa.show-sql=false

# Log 級別：生產環境只開 INFO，避免 log 量過大或洩漏內部資訊
logging.level.com.example.quiz_1141121=INFO
