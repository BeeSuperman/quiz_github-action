spring.application.name=quiz_1141121

# =====================================================
# 資料庫連線設定 → 移至各環境的 profile 設定檔
# application-dev.properties  (本機開發)
# application-prod.properties (EC2 生產)
# 啟動時必須指定 profile，否則無法連線資料庫
# 範例：./gradlew bootRun --args='--spring.profiles.active=dev'
# =====================================================

# SQL 初始化腳本設定
spring.sql.init.mode=always

# JPA 設定（show-sql 由各環境 profile 控制）
# spring.jpa.generate-ddl=false

# 排程設定（共用，所有環境相同）
fixed.rate.ms=3000
aaa.bbb=10000
user.id=Uabc
