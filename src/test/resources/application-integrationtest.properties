# =====================================================
# 整合測試專用設定（只在 @ActiveProfiles("integrationtest") 時生效）
# 用 profile 方式載入，這樣不會覆蓋 main 的 application.properties
# main 的 application.properties 仍然完整保留（aaa.bbb, user.id 等都還在）
# =====================================================

# Testcontainers 啟動的是空白 MySQL，讓 JPA 根據 Entity 自動建表
spring.jpa.hibernate.ddl-auto=create-drop

# 關閉 SQL 初始化腳本，測試環境不需要執行 schema-mysql.sql
spring.sql.init.mode=never

# 關閉 SQL 輸出，測試 log 不需要看每條 SQL
spring.jpa.show-sql=false
