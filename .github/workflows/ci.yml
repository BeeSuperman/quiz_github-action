name: CI Pipeline

# =====================================================
# push 到 master：跑測試 → 測試過了才 build + push Docker
# PR 到 master：只跑測試（不推 image，PR 還沒合併）
# =====================================================
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ─────────────────────────────────────────────────
  # Job 1：跑所有測試（單元測試 + Testcontainers 整合測試）
  # ubuntu-latest 內建 Docker daemon，Testcontainers 自動使用
  # ─────────────────────────────────────────────────
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run all tests
        run: ./gradlew test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  # ─────────────────────────────────────────────────
  # Job 2：Build JAR + 推 Docker image 到 Docker Hub
  # needs: test → 必須等 Job 1 通過才執行，失敗則跳過
  # if: push → PR 時不推 image（程式碼還沒合併）
  # ─────────────────────────────────────────────────
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/quiz-app:latest

  # ─────────────────────────────────────────────────
  # Job 3：SSH 進 EC2，拉最新 image 並重啟服務
  # needs: build-and-push → 必須等 image 推上 Docker Hub 才部署
  # ─────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            docker compose pull
            docker compose up -d
            docker image prune -f
