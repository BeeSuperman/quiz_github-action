plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
   sourceCompatibility = '17'
   targetCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
		implementation 'org.springframework.boot:spring-boot-starter-web'
		//上面這一行可以讓這個專幹一直運行，即運行後的紅燈一直亮著（才可以讓別人一直用），跑完會出現port 端口和多少秒跑完的顯示
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa:4.1.0-M1'
	
	// mysql connector: mysql 的驅動程式
	implementation 'com.mysql:mysql-connector-j'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	//資料驗證
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	
	// openapi 線上文件
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
	// cache
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	// caffeine cache（換成 Redis 後停用）
	// implementation 'com.github.ben-manes.caffeine:caffeine'
	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	
	//在修改程式碼並儲存後,Devtools 會自動偵測變更並觸發應用程式的快速重啟
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Testcontainers：啟動真實 MySQL Docker 容器跑整合測試
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	// 明確指定版本，Spring Boot 4.x 的 BOM 不會自動解析 testcontainers 版本
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testImplementation 'org.testcontainers:mysql:1.20.4'
	
}

tasks.named('test') {
	useJUnitPlatform()
}

task runPasswordGen(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.quiz_1141121.PasswordGen'
}
